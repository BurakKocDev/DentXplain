[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dentxplain"
version = "0.1.0"
description = "Hierarchical dental enumeration and abnormal-tooth detection research pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Burak Koc" }]
dependencies = []

[project.optional-dependencies]
audit = [
  "Pillow>=10,<13",
]
train = [
  "ultralytics>=8.3,<9",
]
service = [
  "fastapi>=0.116,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.35,<1",
  "Pillow>=10,<13",
  "ultralytics>=8.3,<9",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dentxplain.service" = ["static/*.html"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
